[project]
name = "enclave"
version = "0.1.0"
description = "Enclave, a multi-agent territory-capture tournament."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
viewer = ["pillow>=10"]       # MP4 encoding also needs ffmpeg on PATH
dev = ["pytest>=8"]

[project.scripts]
enclave = "enclave.cli:main"

[tool.setuptools.packages.find]
include = ["enclave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
