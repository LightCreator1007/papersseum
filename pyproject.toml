[project]
name = "papersseum"
version = "0.2.0"
description = "Papersseum, a multi-agent territory-capture tournament."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Dhairya Pandya" }]
keywords = ["reinforcement-learning", "multi-agent", "game", "tournament", "paper.io"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/dhairya-pandya/papersseum"
Repository = "https://github.com/dhairya-pandya/papersseum"

[project.optional-dependencies]
viewer = ["pillow>=10"]       # MP4 encoding also needs ffmpeg on PATH
dev = ["pytest>=8"]

[project.scripts]
papersseum = "papersseum.cli:main"

[tool.setuptools.packages.find]
include = ["papersseum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
