[project]
name = "papersseum-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LightCreator1007", email = "arunitchakraborty2006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    # Same as docker/Dockerfile: the engine runs here, so this is the numpy
    # that decides matches and gets written into replay headers.
    "numpy==2.4.6",
    "papersseum",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
papersseum-worker = "papersseum_worker.main:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
papersseum = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
